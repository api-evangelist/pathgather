name: Pathgather
description: >-
  Pathgather was an enterprise Learning Experience Platform (LXP), founded in 2012
  and headquartered in New York City, that helped large enterprises curate, share,
  and track learning content across their existing learning ecosystems. Backed by
  Bloomberg Beta and Techstars, Pathgather (co-founded by CEO Eric Duffy) was one
  of the companies that established the LXP category before being acquired by Degreed
  in June 2018; all employees joined Degreed and the standalone product was wound
  down. Pathgather exposed a REST API in its operating years (a community Python
  client, tonybaloney/pathgather, remains on PyPI as historical evidence), but the
  company no longer operates independently: the pathgather.com domain is now parked
  and publishes no live API, developer portal, or documentation surface. This profile
  is retained in the API Evangelist network as an acquired/defunct company record.
